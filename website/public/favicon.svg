<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A solid car emerging from pixels">
  <rect width="64" height="64" rx="14" fill="#171915"/>

  <!-- The rear of the vehicle dissolves into data pixels. -->
  <g fill="#e65416" shape-rendering="crispEdges">
    <rect x="6" y="25" width="4" height="4" opacity=".42"/>
    <rect x="11" y="17" width="5" height="5" opacity=".68"/>
    <rect x="12" y="35" width="4" height="4" opacity=".56"/>
    <rect x="17" y="23" width="6" height="6" opacity=".88"/>
    <rect x="18" y="34" width="5" height="5"/>
  </g>

  <!-- A continuous, engineered front half completes the vehicle. -->
  <path
    d="M21 28h6.5l5.8-9.2h12.1c3 0 5.6 1.6 7 4.2l2.8 5H58a4 4 0 0 1 4 4v8.5h-5.6a7 7 0 0 0-13.6 0h-8.5a7 7 0 0 0-13.6 0H18V32a4 4 0 0 1 3-4Z"
    fill="#f5f3ed"
  />
  <path d="M35.5 21.8h9.6c1.9 0 3.5.9 4.4 2.5l2 3.7H31.7l3.8-6.2Z" fill="#e65416"/>
  <path d="M42.4 22v6" stroke="#171915" stroke-width="2"/>
  <circle cx="27.5" cy="41" r="5.2" fill="#e65416"/>
  <circle cx="49.7" cy="41" r="5.2" fill="#e65416"/>
  <circle cx="27.5" cy="41" r="2.3" fill="#171915"/>
  <circle cx="49.7" cy="41" r="2.3" fill="#171915"/>
</svg>
